# Cấu hình WinFinder. Token KHÔNG để ở đây — đặt biến môi trường META_AD_LIBRARY_TOKEN
# (trên GitHub: Settings → Secrets and variables → Actions → META_AD_LIBRARY_TOKEN).

database: data/winfinder.db
report_dir: reports

ad_library:
  api_version: v23.0
  # Ad Library API chỉ trả ad thương mại phân phối ở EU (DSA).
  # IE/NL/DK/SE có tỉ lệ ad tiếng Anh cao → proxy tốt cho store US đã lan sang EU.
  countries: [IE, NL, DE, FR, DK, SE, BE, AT, IT, ES, PL]
  lookback_days: 70          # lấy ad bắt đầu chạy trong N ngày gần nhất
  max_pages_per_query: 20    # mỗi page tối đa 250 ad
  request_sleep_seconds: 1.0

# Danh sách ngách nằm ở niches.yaml — sửa trên giao diện web (`winfinder serve`) hoặc sửa tay.
niches_file: niches.yaml
# Hồ sơ chiến lược (định nghĩa winning) — sửa trên giao diện (Hồ sơ) hoặc sửa tay
profiles_file: profiles.yaml

# Domain không phải store (marketplace, mạng xã hội, link rút gọn...) → bỏ qua
exclude_domains:
  - facebook.com
  - fb.me
  - instagram.com
  - amazon.com
  - amazon.de
  - ebay.com
  - etsy.com
  - temu.com
  - aliexpress.com
  - tiktok.com
  - youtube.com
  - linktr.ee
  - bit.ly
  - apps.apple.com
  - play.google.com

# Đà tăng + độ bền ad (thước đo chính): tăng trưởng thật = ad ĐANG SỐNG tăng, ad bền = có lãi, dễ scale
durability:
  profit_days: 30          # ad sống ≥ N ngày = bằng chứng có lãi
  evergreen_days: 60       # ad sống ≥ N ngày = evergreen
  momentum_ratio: 1.5      # ad đang sống (2 tuần gần) / (tuần -6..-4) ≥ N = đang tăng
  min_aged_ads: 3          # cần ≥ N ad đủ tuổi mới kết luận về độ bền
  durable_survival: 0.3    # ≥ 30% ad đủ tuổi sống được ≥ profit_days = bền
  treadmill_survival: 0.15 # < 15% sống được + ra nhiều ad mới = máy xay creative
  treadmill_launches_4w: 6

# Mở rộng store từ domain gốc: tìm mọi page chạy cho store, lấy TOÀN BỘ ad, lần ngược page vệ tinh
expand:
  enabled: true
  top_n: 15             # số store điểm cao nhất được mở rộng mỗi lần quét
  min_score: 40
  countries: []         # trống = 3 nước đầu của ad_library.countries
  max_pages: 5
  refresh_days: 7       # không quét lại page trong N ngày
  resolve_presell: true # advertorial/listicle trên domain khác → nối về store gốc

new_store_days: 90         # store/domain "mới" nếu tuổi ≤ N ngày

enrich:
  top_n: 30                # chỉ làm giàu dữ liệu cho N store điểm cao nhất
  request_sleep_seconds: 1.0

trends:
  # serpapi: ổn định, chạy tốt trên GitHub Actions — cần secret SERPAPI_API_KEY
  # direct : miễn phí, không chính thức — hay bị Google chặn trên IP máy chủ, hợp chạy ở máy cá nhân
  # csv    : đọc file tải tay từ trends.google.com, đặt vào data/trends_csv/<GEO>/*.csv
  provider: serpapi
  csv_dir: data/trends_csv
  timeframe: today 5-y          # cần ≥ 2 năm để tách mùa vụ
  geos: [US, GB, DE, FR, NL]    # nước đầu tiên = thị trường gốc; các nước sau để xem đã lan chưa
  cache_days: 6                 # không gọi lại API nếu dữ liệu mới hơn N ngày
  request_sleep_seconds: 1.0
  expand:
    autocomplete: true          # thêm gợi ý Google Autocomplete vào bộ keyword
    alphabet: false             # thêm 'seed a', 'seed b'... (nhiều keyword hơn, nhiều request hơn)
    max_keywords: 12
    max_keywords_other_geos: 5  # nước ngoài thị trường gốc chỉ lấy N keyword đầu (tiết kiệm request)
  # Bỏ trống `topics` → mỗi `searches` ở trên tự thành một chủ đề.
  topics:
    - name: posture
      seeds: ["posture corrector"]          # seeds[0] là keyword neo
      keywords: ["posture brace", "back straightener"]
      # volume_hint: 74000                  # search/tháng của seeds[0] ở volume_hint_geo (Keyword Planner) → ước TAM
      # volume_hint_geo: US
      geo_keywords:                         # keyword bản địa — tiếng Anh ở DE/FR không phản ánh nhu cầu thật
        DE: ["haltungskorrektur", "geradehalter"]
        FR: ["correcteur de posture"]
        NL: ["houdingcorrector"]
    - name: pet-grooming
      seeds: ["cat hair remover"]
      keywords: ["dog grooming brush", "pet hair remover"]

# Nối store (Ad Library) ↔ nhu cầu (Trends): rút keyword sản phẩm từ ad + Shopify rồi chạy Trends
link:
  top_n: 20             # số store điểm ad cao nhất được xét
  only_scaling: false   # true: chỉ store có nhãn SCALE
  min_ad_score: 50
  max_keywords: 4       # keyword sản phẩm tối đa / store
  autocomplete: false   # mở rộng bằng Autocomplete (thêm request)
  overrides: {}         # đặt tay khi tool rút sai, vd: { postureglow.com: ["posture corrector", "posture brace"] }
  fetch_pages: true     # đọc trang sản phẩm / trang chủ khi Shopify products.json không đủ thông tin
  page_refresh_days: 14
  need_trends: true     # chạy Trends cho cả keyword nhu cầu (vd "eye bags") — biết thị trường gốc có đang lớn không
  llm:                  # Claude đọc ad + trang sản phẩm để hiểu sản phẩm là gì (cần ANTHROPIC_API_KEY)
    enabled: true       # không có key → tự dùng heuristic
    model: claude-opus-5-5
    effort: low         # trích xuất đơn giản — low là đủ, rẻ và nhanh
  traffic:              # traffic có tăng song song với ad không: đo lượt tìm TÊN BRAND trên Google Trends
    enabled: true
    brand_geo: ""       # "" = toàn cầu
    timeframe: today 12-m

# Angle / persona: Claude chia ad của mỗi sản phẩm thành các angle, đo angle nào đang lên (cần ANTHROPIC_API_KEY)
angles:
  enabled: true
  model: claude-opus-5-5
  effort: medium
  min_ads: 4            # cần ít nhất N nội dung ad khác nhau
  max_products: 15      # chỉ phân tích N sản phẩm điểm ứng viên cao nhất

weights:
  momentum: 0.25     # ad đang sống tăng
  durability: 0.30   # tỉ lệ sống sót ≥ 30 ngày + số ad bền đang chạy
  duplication: 0.10  # % ad đang sống thuộc creative được nhân bản
  direct: 0.10       # chạy thẳng store/PDP (ưu tiên) thay vì qua advertorial/listicle
  reach: 0.05        # eu_total_reach
  newness: 0.10      # store mới
  spread: 0.10       # số thị trường đã chạy
