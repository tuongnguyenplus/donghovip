[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winfinder"
version = "0.1.0"
description = "Tìm sản phẩm / angle đang vào phase scale từ Ad Library, traffic và trends"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "anthropic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
winfinder = "winfinder.cli:main"

[tool.setuptools.packages.find]
include = ["winfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
